backend:
  name: git-gateway
  branch: main

media_folder: "assets/img"
public_folder: "assets/img"

collections:
  - name: "pages"
    label: "网站内容管理"
    files:
      - label: "首页图文配置"
        name: "content"
        file: "data/content.json"
        fields:
          - { label: "【基础】首屏大标题 (中/英/俄)", name: "hero_titles", widget: "object", fields: [ {name: zh, widget: string}, {name: en, widget: string}, {name: ru, widget: string} ] }
          - { label: "【基础】首屏副标题 (中/英/俄)", name: "hero_subs", widget: "object", fields: [ {name: zh, widget: string}, {name: en, widget: string}, {name: ru, widget: string} ] }
          - { label: "🖼️ 首屏大背景图", name: "hero_img", widget: "image", required: false }
          
          - { label: "【介绍】关于我们正文 (中/英/俄)", name: "about_descs", widget: "object", fields: [ {name: zh, widget: text}, {name: en, widget: text}, {name: ru, widget: text} ] }
          - { label: "🖼️ 关于我们配图", name: "about_img", widget: "image", required: false }

          - { label: "🖼️ 核心产品 1 - 宁红茶 (图片)", name: "p1_img", widget: "image", required: false }
          - { label: "🖼️ 核心产品 2 - 双井绿茶 (图片)", name: "p2_img", widget: "image", required: false }
          - { label: "🖼️ 核心产品 3 - 庐山云雾茶 (图片)", name: "p3_img", widget: "image", required: false }