<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>昭盛元 · 后台管理</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>
/* ============================================================
   1) 后台界面：把还没被 Decap 中文化的按钮补成中文
      （config.yml 里 locale: zh_CN 已处理大部分，这里是补充）
   ============================================================ */
body { -webkit-font-smoothing: antialiased; }

/* 2) 三语字段并排显示（中文 / English / Русский）
      Decap 的 object widget 默认是上下竖排，这里改成三列横排。
      如果选择器没命中，会自动退回竖排 —— 不影响使用。 */
@media (min-width: 1100px) {
  div[class*="ObjectWidget"] > div,
  div[class*="objectWidget"] > div,
  div[class*="object"] > div:not([class*="label"]) {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 10px 14px !important;
    align-items: start !important;
  }
  /* 并排后每个输入框上方的文字标签保留，但缩小间距 */
  div[class*="ObjectWidget"] > div > *,
  div[class*="objectWidget"] > div > * {
    margin-bottom: 0 !important;
    min-width: 0;
  }
  /* 文本域在窄列里也要够高 */
  div[class*="ObjectWidget"] textarea,
  div[class*="objectWidget"] textarea { min-height: 92px; }
}

/* 3) 视觉微调：让编辑区更紧凑、更好读 */
form { max-width: 100%; }
input, textarea, select { font-size: 14px !important; }

/* ============================================================
   4) 简约高端皮肤
      深色顶栏 + 暖白内容区 + 金铜色强调
      Decap 内部用的是 CSS Modules（类名带哈希），
      因此这里主要靠「语义化标签 + 结构层级」来命中，
      选择器没命中的部分会自动保持默认观感，不影响功能。
   ============================================================ */

/* 顶栏 */
header, [class*="StyledTopBar"], nav[class*="TopBar"] {
  background: #171a1d !important;
  border-bottom: 0 !important;
  box-shadow: 0 1px 0 rgba(0,0,0,.06) !important;
}
header *, [class*="StyledTopBar"] * { color: rgba(255,255,255,.85) !important; }

/* 主背景 */
main, [class*="StyledMain"], body > div > div {
  background: #faf9f7 !important;
}

/* 侧栏（集合列表） */
[class*="Sidebar"], aside, [class*="StyledSidebar"] {
  background: #fff !important;
  border-right: 1px solid #e9e6e1 !important;
}
[class*="Sidebar"] a, aside a,
[class*="Collection"] li > a, [class*="StyledCollection"] a {
  border-radius: 8px !important;
  transition: all .16s ease !important;
}

/* 卡片 / 条目 */
[class*="StyledCard"], [class*="Card"], article {
  background: #fff !important;
  border: 1px solid #e9e6e1 !important;
  border-radius: 11px !important;
  box-shadow: 0 1px 3px rgba(0,0,0,.03) !important;
}

/* 按钮 */
button {
  border-radius: 8px !important;
  letter-spacing: .2px;
  transition: all .18s ease !important;
}
[class*="StyledButton"], button[class*="button"] {
  font-weight: 500 !important;
}

/* 输入框 */
input, textarea, select {
  border-radius: 8px !important;
  border-color: #e9e6e1 !important;
  background: #fff !important;
}
input:focus, textarea:focus, select:focus {
  border-color: #b8894a !important;
  box-shadow: 0 0 0 3px rgba(184,137,74,.10) !important;
  outline: none !important;
}

/* 标题层级更克制 */
h1, h2, h3 { letter-spacing: .3px !important; font-weight: 600 !important; }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #d8d4ce; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #b8894a; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

<script>
/* ============================================================
   说明：
   上一版的自定义预览模板会触发 React 错误 #525
   （自己加载的 React 与 Decap 内置的 React 冲突）。
   本版已移除自定义预览，改用 Decap 原生预览 —— 同样是
   「左边改、右边立刻变」，而且稳定不报错。

   想要「和真实前端一模一样」的预览，请用同目录下的
   《离线管理后台.html》：全中文界面 + 三语并排 + 内嵌真实页面预览。
   ============================================================ */

(function () {
  if (typeof CMS === 'undefined') return;
  try {
    /* 把前台样式注入预览区，让默认预览的观感贴近真实页面 */
    CMS.registerPreviewStyle(window.location.origin + '/assets/css/style.css');
  } catch (e) {
    /* 注入失败不影响后台使用 */
  }
})();

/* Netlify Identity：从邀请邮件进来时，登录后自动跳回后台 */
if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', function (user) {
    if (!user) {
      window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; });
    }
  });
}
</script>
</body>
</html>
