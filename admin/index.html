<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>昭盛元 · 后台管理</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>
/* ============================================================
   1) 后台界面：把还没被 Decap 中文化的按钮补成中文
      （config.yml 里 locale: zh_CN 已处理大部分，这里是补充）
   ============================================================ */
body { -webkit-font-smoothing: antialiased; }

/* 2) 三语字段并排显示（中文 / English / Русский）
      Decap 的 object widget 默认是上下竖排，这里改成三列横排。
      如果选择器没命中，会自动退回竖排 —— 不影响使用。 */
@media (min-width: 1100px) {
  div[class*="ObjectWidget"] > div,
  div[class*="objectWidget"] > div,
  div[class*="object"] > div:not([class*="label"]) {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 10px 14px !important;
    align-items: start !important;
  }
  /* 并排后每个输入框上方的文字标签保留，但缩小间距 */
  div[class*="ObjectWidget"] > div > *,
  div[class*="objectWidget"] > div > * {
    margin-bottom: 0 !important;
    min-width: 0;
  }
  /* 文本域在窄列里也要够高 */
  div[class*="ObjectWidget"] textarea,
  div[class*="objectWidget"] textarea { min-height: 92px; }
}

/* 3) 视觉微调：让编辑区更紧凑、更好读 */
form { max-width: 100%; }
input, textarea, select { font-size: 14px !important; }
</style>
</head>
<body>

<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

<script>
/* ============================================================
   说明：
   上一版的自定义预览模板会触发 React 错误 #525
   （自己加载的 React 与 Decap 内置的 React 冲突）。
   本版已移除自定义预览，改用 Decap 原生预览 —— 同样是
   「左边改、右边立刻变」，而且稳定不报错。

   想要「和真实前端一模一样」的预览，请用同目录下的
   《离线管理后台.html》：全中文界面 + 三语并排 + 内嵌真实页面预览。
   ============================================================ */

(function () {
  if (typeof CMS === 'undefined') return;
  try {
    /* 把前台样式注入预览区，让默认预览的观感贴近真实页面 */
    CMS.registerPreviewStyle(window.location.origin + '/assets/css/style.css');
  } catch (e) {
    /* 注入失败不影响后台使用 */
  }
})();

/* Netlify Identity：从邀请邮件进来时，登录后自动跳回后台 */
if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', function (user) {
    if (!user) {
      window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; });
    }
  });
}
</script>
</body>
</html>
