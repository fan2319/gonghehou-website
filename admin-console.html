<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昭盛元 · 中文管理后台</title>
<style>
:root{
  --brand:#1a3a5c; --brand2:#245a7a; --gold:#c8a55b; --ink:#152233;
  --muted:#6b7a8a; --line:#e2e8ef; --bg:#f5f7fa; --bg2:#fff;
  --ok:#2f8f5b; --bad:#c0392b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}

/* ---------- 顶部 ---------- */
.top{background:var(--brand);color:#fff;padding:0 18px;height:56px;
 display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.top h1{font-size:1.05rem;margin:0;font-weight:700}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
 color:#fff;padding:7px 14px;border-radius:7px;font-size:.85rem;transition:.2s}
.top button:hover{background:rgba(255,255,255,.26)}
.top button.pri{background:var(--gold);color:#1a2a1a;border-color:var(--gold);font-weight:700}
.top button.pri:hover{background:#d8b76b}

/* ---------- 三栏 ---------- */
.wrap{display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,1fr);
 gap:0;height:calc(100vh - 56px)}
.side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 0}
.side .t{font-size:.72rem;letter-spacing:1.4px;color:var(--gold);font-weight:700;
 padding:12px 16px 6px;text-transform:uppercase}
.side a{display:block;padding:9px 16px;font-size:.9rem;color:var(--ink);
 border-left:3px solid transparent;transition:.15s}
.side a:hover{background:var(--bg)}
.side a.on{background:#eef4fa;border-left-color:var(--brand);color:var(--brand);font-weight:700}
.side a .n{float:right;color:var(--muted);font-size:.78rem}

.edit{overflow-y:auto;padding:20px 22px;background:#fff;border-right:1px solid var(--line)}
.prev{overflow:hidden;display:flex;flex-direction:column;background:#eef1f5}
.prevbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;
 display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prevbar b{font-size:.85rem;color:var(--brand)}
.prevbar button{background:var(--bg);border:1px solid var(--line);border-radius:6px;
 padding:5px 11px;font-size:.8rem;transition:.2s}
.prevbar button:hover{border-color:var(--brand);color:var(--brand)}
.prevbar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.prevbar .sp{flex:1}
.prevbar small{color:var(--muted);font-size:.76rem}
#pvFrame{flex:1;width:100%;border:0;background:#fff}

/* ---------- 编辑控件 ---------- */
.grp{margin-bottom:26px}
.grp>h3{font-size:.78rem;letter-spacing:1.6px;color:var(--gold);text-transform:uppercase;
 margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line);font-weight:700}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:.86rem;font-weight:700;color:var(--brand);margin-bottom:6px}
.fld .hint{font-size:.76rem;color:var(--muted);margin-top:4px}

/* 三语并排 */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio .cell{min-width:0}
.trio .cell span{display:block;font-size:.72rem;color:var(--muted);font-weight:700;
 margin-bottom:3px;padding-left:2px}
.trio input,.trio textarea{width:100%;border:1px solid var(--line);border-radius:7px;
 padding:8px 10px;font-size:.87rem;background:#fbfcfe;transition:.15s}
.trio input:focus,.trio textarea:focus{outline:none;border-color:var(--brand);background:#fff;
 box-shadow:0 0 0 3px rgba(26,58,92,.09)}
.trio textarea{min-height:88px;resize:vertical;line-height:1.65}
.trio .cell:nth-child(2) span::before{content:'EN · '}
.trio .cell:nth-child(3) span::before{content:'RU · '}

input.plain,textarea.plain,select.plain{width:100%;border:1px solid var(--line);
 border-radius:7px;padding:8px 10px;font-size:.88rem;background:#fbfcfe}
input.plain:focus,textarea.plain:focus,select.plain:focus{outline:none;
 border-color:var(--brand);background:#fff}

/* 列表条目 */
.item{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:9px;position:relative}
.item .bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.item .bar .idx{font-size:.74rem;color:var(--muted);font-weight:700;min-width:18px}
.item .bar .sp{flex:1}
.item .bar button{background:#fff;border:1px solid var(--line);border-radius:6px;
 width:26px;height:26px;font-size:.8rem;color:var(--muted);line-height:1}
.item .bar button:hover{border-color:var(--brand);color:var(--brand)}
.item .bar button.del:hover{border-color:var(--bad);color:var(--bad)}

.addbtn{width:100%;border:1px dashed var(--brand);color:var(--brand);background:#fff;
 border-radius:8px;padding:9px;font-size:.85rem;font-weight:700;transition:.2s}
.addbtn:hover{background:#eef4fa}

/* 图片 */
.imgrow{display:flex;gap:10px;align-items:flex-start}
.imgrow .thumb{width:88px;height:66px;border:1px solid var(--line);border-radius:7px;
 background:#f0f3f6 center/cover no-repeat;flex-shrink:0}
.imgrow .r{flex:1;min-width:0}
.imgrow input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.82rem}
.imgrow .btns{display:flex;gap:6px;margin-top:6px}
.imgrow .btns button{background:var(--bg);border:1px solid var(--line);border-radius:6px;
 padding:5px 11px;font-size:.8rem}
.imgrow .btns button:hover{border-color:var(--brand);color:var(--brand)}

/* 开关 */
.sw{display:flex;align-items:center;gap:7px;font-size:.86rem}
.sw input{width:16px;height:16px}

/* 提示条 */
.bar-msg{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;
 background:var(--brand);color:#fff;padding:11px 22px;border-radius:9px;
 font-size:.88rem;z-index:99;box-shadow:0 8px 24px rgba(20,40,60,.28);opacity:0;
 transition:.25s;pointer-events:none}
.bar-msg.show{opacity:1}

.intro{background:#fff;border-radius:11px;padding:22px;border-left:4px solid var(--gold);
 box-shadow:0 2px 10px rgba(20,40,60,.07)}
.intro h2{margin:0 0 10px;font-size:1.1rem;color:var(--brand)}
.intro p{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.intro ol{margin:0;padding-left:20px;color:var(--muted);font-size:.88rem}
.intro li{margin-bottom:6px}

@media(max-width:1200px){
  .wrap{grid-template-columns:170px minmax(0,1fr);}
  .prev{display:none}
  .prev.mobile-show{display:flex;position:fixed;inset:56px 0 0 0;z-index:80}
}
@media(max-width:820px){
  .wrap{grid-template-columns:1fr}
  .side{display:none}
  .trio{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="top">
  <h1>昭盛元 · 中文管理后台</h1>
  <span class="sp"></span>

  <button onclick="exportJSON('products')">⬇ products.json</button>
  <button onclick="exportSingle()">⬇ 单文件网页</button>
  <button class="pri" onclick="toast('已记在本地浏览器；请在 Netlify 后台 Publish 才会上线')">💾 保存</button>

<div class="wrap">

  <section class="edit" id="edit"></section>
  <section class="prev" id="prev">

      <b>实时预览</b>

      <button onclick="pvLang('ru',this)">RU</button>
      <span class="sp"></span>
      <button onclick="pvReload()">刷新</button>

    </div>
    <iframe id="pvFrame" title="预览"></iframe>
  </section>
</div>

<div class="bar-msg" id="toast"></div>
<input type="file" id="fileSite" accept=".json" style="display:none">
<input type="file" id="fileProd" accept=".json" style="display:none">
<input type="file" id="fileImg" accept="image/*" style="display:none">

 \"ru\": \"\u0423\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0446\u0435\u043f\u044f\u043c\u0438 \u043f\u043e\u0441\u0442\u0430\u0432\u043e\u043a\" },\n    { \"zh\": \"\u533a\u5757\u94fe\u6280\u672f\u76f8\u5173\u8f6f\u4ef6\u548c\u670d\u52a1\uff08\u975e\u91d1\u878d\u7c7b\uff09\", \"en\": \"Blockchain software & services (non-financial)\", \"ru\": \"\u0411\u043b\u043e\u043a\u0447\u0435\u0439\u043d-\u041f\u041e \u0438 \u0443\u0441\u043b\u0443\u0433\u0438 (\u043d\u0435 \u0444\u0438\u043d\u0430\u043d\u0441\u043e\u0432\u044b\u0435)\" },\n    { \"zh\": \"\u5de5\u827a\u7f8e\u672f\u54c1\u53ca\u6536\u85cf\u54c1\u96f6\u552e\", \"en\": \"Retail of arts, crafts & collectibles\", \"ru\": \"\u0420\u043e\u0437\u043d\u0438\u0447\u043d\u0430\u044f \u0442\u043e\u0440\u0433\u043e\u0432\u043b\u044f \u0438\u0437\u0434\u0435\u043b\u0438\u044f\u043c\u0438 \u0438\u0441\u043a\u0443\u0441\u0441\u0442\u0432\u0430\" }\n  ],\n  \"qual_note\": {\n    \"zh\": \"\u4ee5\u4e0a\u5747\u53d6\u81ea\u516c\u53f8\u7ecf\u8425\u8303\u56f4\uff0c\u53ef\u5728\u56fd\u5bb6\u4f01\u4e1a\u4fe1\u7528\u4fe1\u606f\u516c\u793a\u7cfb\u7edf\u6838\u9a8c\u3002\u7edf\u4e00\u793e\u4f1a\u4fe1\u7528\u4ee3\u7801 91360424MAKJBPTM33\u3002\u533a\u5757\u94fe\u76f8\u5173\u670d\u52a1\u4ec5\u9650\u6eaf\u6e90\u9632\u4f2a\u4e0e\u5355\u636e\u5b58\u8bc1\uff0c\u4e0d\u6d89\u53ca\u4efb\u4f55\u865a\u62df\u8d27\u5e01\u3001\u4ee3\u5e01\u53d1\u884c\u6216\u652f\u4ed8\u7ed3\u7b97\u4e1a\u52a1\u3002\",\n    \"en\": \"All items above are taken from the company's registered business scope and can be verified on the National Enterprise Credit Information Publicity System. Unified Social Credit Code 91360424MAKJBPTM33. Blockchain-related services are limited to traceability, anti-counterfeiting and document attestation \u2014 no virtual currency, token issuance or payment settlement involved.\",\n    \"ru\": \"\u0412\u0441\u0435 \u043f\u0443\u043d\u043a\u0442\u044b \u0432\u0437\u044f\u0442\u044b \u0438\u0437 \u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e \u0432\u0438\u0434\u0430 \u0434\u0435\u044f\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438 \u0438 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u044e\u0442\u0441\u044f \u0432 \u041d\u0430\u0446\u0438\u043e\u043d\u0430\u043b\u044c\u043d\u043e\u0439 \u0441\u0438\u0441\u0442\u0435\u043c\u0435 \u0440\u0430\u0441\u043a\u0440\u044b\u0442\u0438\u044f \u043a\u043e\u0440\u043f\u043e\u0440\u0430\u0442\u0438\u0432\u043d\u043e\u0439 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0438. \u0415\u0434\u0438\u043d\u044b\u0439 \u0441\u043e\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0439 \u043a\u043e\u0434 91360424MAKJBPTM33. \u0423\u0441\u043b\u0443\u0433\u0438 \u0431\u043b\u043e\u043a\u0447\u0435\u0439\u043d\u0430 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0432\u0430\u044e\u0442\u0441\u044f \u043f\u0440\u043e\u0441\u043b\u0435\u0436\u0438\u0432\u0430\u0435\u043c\u043e\u0441\u0442\u044c\u044e, \u0437\u0430\u0449\u0438\u0442\u043e\u0439 \u043e\u0442 \u043f\u043e\u0434\u0434\u0435\u043b\u043a\u0438 \u0438 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u0435\u043c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u2014 \u0431\u0435\u0437 \u0432\u0438\u0440\u0442\u0443\u0430\u043b\u044c\u043d\u044b\u0445 \u0432\u0430\u043b\u044e\u0442, \u0432\u044b\u043f\u0443\u0441\u043a\u0430 \u0442\u043e\u043a\u0435\u043d\u043e\u0432 \u0438 \u043f\u043b\u0430\u0442\u0435\u0436\u0435\u0439.\"\n  },\n\n  \"cap_title\": { \"zh\": \"\u6211\u4eec\u80fd\u505a\u4ec0\u4e48\", \"en\": \"What We Do\", \"ru\": \"\u0427\u0442\u043e \u043c\u044b \u0434\u0435\u043b\u0430\u0435\u043c\" },\n  \"cap_lead\": {\n    \"zh\": \"\u4ece\u9009\u54c1\u5230\u6e05\u5173\u6d3e\u9001\uff0c\u4e03\u4e2a\u73af\u8282\uff0c\u4e00\u4e2a\u5bf9\u63a5\u4eba\u3002\",\n    \"en\": \"From sourcing to customs clearance and delivery \u2014 seven steps, one point of contact.\",\n    \"ru\": \"\u041e\u0442 \u043f\u043e\u0434\u0431\u043e\u0440\u0430 \u0434\u043e \u0442\u0430\u043c\u043e\u0436\u043d\u0438 \u0438 \u0434\u043e\u0441\u0442\u0430\u0432\u043a\u0438 \u2014 \u0441\u0435\u043c\u044c \u044d\u0442\u0430\u043f\u043e\u0432, \u043e\u0434\u0438\u043d \u043a\u043e\u043d\u0442\u0430\u043a\u0442.\"\n  },\n  \"cap_items\": [\n    { \"zh\": \"\u9700\u6c42\u786e\u8ba4\uff1a\u54c1\u7c7b\u3001\u89c4\u683c\u3001\u76ee\u6807\u5e02\u573a\u3001\u5408\u89c4\u8981\u6c42\", \"en\": \"Requirements: category, spec, target market, compliance\", \"ru\": \"\u0422\u0440\u0435\u0431\u043e\u0432\u0430\u043d\u0438\u044f: \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f, \u0422\u0417, \u0440\u044b\u043d\u043e\u043a, \u043a\u043e\u043c\u043f\u043b\u0430\u0435\u043d\u0441\" },\n    { \"zh\": \"\u9009\u54c1\u91c7\u8d2d\uff1a\u4ea7\u5730\u76f4\u91c7\uff0c\u591a\u5bb6\u5de5\u5382\u6bd4\u4ef7\u4e0e\u6253\u6837\", \"en\": \"Sourcing: direct from origin, multi-factory comparison\", \"ru\": \"\u041f\u043e\u0434\u0431\u043e\u0440: \u043d\u0430\u043f\u0440\u044f\u043c\u0443\u044e \u043e\u0442 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0430, \u0441\u0440\u0430\u0432\u043d\u0435\u043d\u0438\u0435 \u0444\u0430\u0431\u0440\u0438\u043a\" },\n    { \"zh\": \"\u9a8c\u8d27\u8d28\u68c0\uff1a\u51fa\u8d27\u524d\u68c0\u9a8c\uff0c\u652f\u6301\u7b2c\u4e09\u65b9\u9a8c\u8d27\", \"en\": \"Inspection: pre-shipment check, third-party accepted\", \"ru\": \"\u0418\u043d\u0441\u043f\u0435\u043a\u0446\u0438\u044f: \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043f\u0435\u0440\u0435\u0434 \u043e\u0442\u0433\u0440\u0443\u0437\u043a\u043e\u0439\" },\n    { \"zh\": \"\u4ed3\u50a8\u96c6\u8d27\uff1a\u591a\u4f9b\u5e94\u5546\u8d27\u7269\u5408\u5e76\uff0c\u964d\u4f4e\u5934\u7a0b\u6210\u672c\", \"en\": \"Consolidation: merge suppliers to cut first-leg cost\", \"ru\": \"\u041a\u043e\u043d\u0441\u043e\u043b\u0438\u0434\u0430\u0446\u0438\u044f: \u043e\u0431\u044a\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u043f\u043e 430, \u043f\u0440\u0430\u0432\u0438\u043b, \u043d\u0430\u043b\u0438\u0447\u0438\u044f \u043c\u0435\u0441\u0442 \u0438 \u0441\u0442\u0440\u0430\u043d\u044b \u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f. \u0424\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0445 \u0442\u0430\u0440\u0438\u0444\u043e\u0432 \u043d\u0435 \u043f\u0443\u0431\u043b\u0438\u043a\u0443\u0435\u043c \u2014 \u0443\u043a\u0430\u0436\u0438\u0442\u0435 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044e, \u043e\u0431\u044a\u0451\u043c, \u0432\u0435\u0441 \u0438 \u043f\u043e\u0440\u0442 \u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f.\"\n  },\n\n  \"why_title\": { \"zh\": \"\u4e3a\u4ec0\u4e48\u9009\u62e9\u6211\u4eec\", \"en\": \"Why Work With Us\", \"ru\": \"\u041f\u043e\u0447\u0435\u043c\u0443 \u043c\u044b\" },\n  \"why_items\": [\n    { \"title\": { \"zh\": \"\u8fdb\u51fa\u53e3\u8d44\u8d28\u9f50\u5907\", \"en\": \"Fully licensed for trade\", \"ru\": \"\u041f\u043e\u043b\u043d\u044b\u0439 \u043d\u0430\u0431\u043e\u0440 \u043b\u0438\u0446\u0435\u043d\u0437\u0438\u0439\" },\n      \"text\": { \"zh\": \"\u7ecf\u8425\u8303\u56f4\u542b\u8d27\u7269\u8fdb\u51fa\u53e3\u3001\u6280\u672f\u8fdb\u51fa\u53e3\u4e0e\u8fdb\u51fa\u53e3\u4ee3\u7406\uff0c\u53ef\u76f4\u63a5\u7ec4\u7ec7\u8de8\u5883\u4ea4\u4ed8\u3002\", \"en\": \"Our scope covers goods, technology and agency \u2014 we can organise cross-border delivery directly.\", \"ru\": \"\u0412\u0438\u0434 \u0434\u0435\u044f\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438 \u0432\u043a\u043b\u044e\u0447\u0430\u0435\u0442 \u0442\u043e\u0432\u0430\u0440\u044b, \u0442\u0435\u0445\u043d\u043e\u043b\u043e\u0433\u0438\u0438 \u0438 \u0430\u0433\u0435\u043d\u0442\u0441\u043a\u0443\u044e \u0412\u042d\u0414.\" } },\n    { \"title\": { \"zh\": \"\u4ea7\u5730\u76f4\u91c7\", \"en\": \"Source-direct procurement\", \"ru\": \"\u0417\u0430\u043a\u0443\u043f\u043a\u0430 \u0443 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0430\" },\n      \"text\": { \"zh\": \"\u6ce8\u518c\u5730\u4f4d\u4e8e\u4fee\u6c34\u53bf\u8336\u53f6\u4ea7\u533a\uff0c\u51cf\u5c11\u4e2d\u95f4\u73af\u8282\u3002\", \"en\": \"Registered in Xiushui, a tea-producing county \u2014 fewer middlemen.\", \"ru\": \"\u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u0432 \u0447\u0430\u0435\u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u044f\u0449\u0435\u043c \u0443\u0435\u0437\u0434\u0435 \u0421\u044e\u0448\u0443\u0439 \u2014 \u043c\u0435\u043d\u044c\u0448\u0435 \u043f\u043e\u0441\u0440\u0435\u0434\u043d\u0438\u043a\u043e\u0432.\" } },\n    { \"title\": { \"zh\": \"\u4f9b\u5e94\u94fe\u7ba1\u7406\u662f\u4e3b\u4e1a\", \"en\": \"Supply chain is our core\", \"ru\": \"\u0423\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043f\u043e\u0441\u0442\u0430\u0432\u043a\u0430\u043c\u0438 \u2014 \u043f\u0440\u043e\u0444\u0438\u043b\u044c\" },\n      \"text\": { \"zh\": \"\u4f9b\u5e94\u94fe\u7ba1\u7406\u670d\u52a1\u5728\u518c\uff0c\u4e0d\u662f\u517c\u8425\u3002\", \"en\": \"Supply-chain management is registered as our core business, not a side line.\", \"ru\": \"\u0423\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0446\u0435\u043f\u044f\u043c\u0438 \u043f\u043e\u0441\u0442\u0430\u0432\u043e\u043a \u2014 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u0432\u0438\u0434 \u0434\u0435\u044f\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438.\" } },\n    { \"title\": { \"zh\": \"\u6eaf\u6e90\u4e0e\u5355\u636e\u5b58\u8bc1\", \"en\": \"Traceability & attestation\", \"ru\": \"\u041f\u0440\u043e\u0441\u043b\u0435\u0436\u0438\u0432\u0430\u0435\u043c\u043e\u0441\u0442\u044c\" },\n      \"text\": { \"zh\": \"\u533a\u5757\u94fe\u76f8\u5173\u670d\u52a1\u7528\u4e8e\u6eaf\u6e90\u9632\u4f2a\u4e0e\u5355\u636e\u5b58\u8bc1\uff0c\u975e\u91d1\u878d\u7c7b\uff0c\u5408\u89c4\u53ef\u63a7\u3002\", \"en\": \"Blockchain services used only for traceability and document attestation \u2014 non-financial and compliant.\", \"ru\": \"\u0411\u043b\u043e\u043a\u0447\u0435\u0439\u043d \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043f\u0440\u043e\u0441\u043b\u0435\u0436\u0438\u0432\u0430\u0435\u043c\u043e\u0441\u0442\u0438 \u0438 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u2014 \u043d\u0435 \u0444\u0438\u043d\u0430\u043d\u0441\u043e\u0432\u044b\u0439.\" } },\n    { \"title\": { \"zh\": \"\u591a\u54c1\u7c7b\u53ef\u62d3\u5c55\", \"en\": \"Multi-category, extensible\", \"ru\": \"\u041c\u0443\u043b\u044c\u0442\u0438\u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0439\u043d\u043e\u0441\u0442\u044c\" },\n      \"text\": { \"zh\": \"\u8336\u53f6\u5df2\u843d\u5730\uff0c\u74f7\u5668\u4e0e\u673a\u7535\u6cf5\u9600\u9646\u7eed\u4e0a\u67b6\uff0c\u4e00\u4e2a\u7a97\u53e3\u5bf9\u63a5\u591a\u4e2a\u54c1\u7c7b\u3002\", \"en\": \"Tea is live; porcelain and pumps are coming \u2014 one window for several categories.\", \"ru\": \"\u0427\u0430\u0439 \u0443\u0436\u0435 \u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d, \u0444\u0430\u0440\u0444\u043e\u0440 \u0438 \u043d\u0430\u0441\u043e\u0441\u044b \u2014 \u0432 \u0440\u0430\u0431\u043e\u0442\u0435.\" } },\n    { \"title\": { \"zh\": \"\u4e2d\u4fc4\u53cc\u8bed\u76f4\u63a5\u6c9f\u901a\", \"en\": \"Direct contact in RU / EN / ZH\", \"ru\": \"\u041f\u0440\u044f\u043c\u0430\u044f \u0441\u0432\u044f\u0437\u044c \u043d\u0430 RU / EN / ZH\" },\n      \"text\": { \"zh\": \"\u4fc4\u7f57\u65af\u53f7\u7801\u4e0e Telegram \u76f4\u8fbe\uff0c\u4e0d\u7528\u7b49\u90ae\u4ef6\u6765\u56de\u3002\", \"en\": \"A Russian phone number and Telegram \u2014 no waiting on email threads.\", \"ru\": \"\u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u0438\u0439 \u043d\u043e\u043c\u0435\u0440 \u0438 Telegram \u2014 \u0431\u0435\u0437 \u0434\u043e\u043b\u0433\u043e\u0439 \u043f\u0435\u0440\u0435\u043f\u0438\u0441\u043a\u0438.\" } }\n  ],\n\n  \"term_title\": { \"zh\": \"\u5408\u4f5c\u6761\u6b3e\", \"en\": \"Terms of Trade\", \"ru\": \"\u0423\u0441\u043b\u043e\u0432\u0438\u044f \u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u0447\u0435\u0441\u0442\u0432\u0430\" },\n  \"term_items\": [\n    { \"title\": { \"zh\": \"\u8d77\u8ba2\u91cf\", \"en\": \"Minimum order\", \"ru\": \"\u041c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u0437\u0430\u043a\u0430\u0437\" },\n      \"text\": { \"zh\": \"\u6309\u54c1\u7c7b\u3001\u89c4\u683c\u4e0e\u5b9a\u5236\u7a0b\u5ea6\u800c\u5b9a\uff0c\u73b0\u8d27\u4f4e\u4e8e\u5b9a\u5236\u3002\u8bf7\u4ee5\u8be2\u76d8\u786e\u8ba4\u4e3a\u51c6\u3002\", \"en\": \"Depends on category, spec and customisation; stock is lower than custom. Confirm by enquiry.\", \"ru\": \"\u0417\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0438 \u0422\u0417; \u0441\u0442\u043e\u043a \u043d\u0438\u0436\u0435 \u043a\u0430\u0441\u0442\u043e\u043c\u0430.\" } },\n    { \"title\": { \"zh\": \"\u6837\u54c1\", \"en\": \"Samples\", \"ru\": \"\u041e\u0431\u0440\u0430\u0437\u0446\u044b\" },\n      \"text\": { \"zh\": \"\u652f\u6301\u5bc4\u6837\u3002\u6837\u54c1\u8d39\u4e0e\u8fd0\u8d39\u6309\u5b9e\u9645\u7ed3\u7b97\uff0c\u5927\u5355\u786e\u8ba4\u540e\u53ef\u62b5\u6263\u8d27\u6b3e\u3002\", \"en\": \"Samples available; cost settled at actuals and credited against a confirmed bulk order.\", \"ru\": \"\u041e\u0431\u0440\u0430\u0437\u0446\u044b \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u044e\u0442\u0441\u044f; \u0437\u0430\u0442\u0440\u0430\u0442\u044b \u0437\u0430\u0441\u0447\u0438\u0442\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u043f\u0440\u0438 \u0437\u0430\u043a\u0430\u0437\u0435.\" } },\n    { \"title\": { \"zh\": \"\u6253\u6837\u4e0e\u4ea4\u671f\", \"en\": \"Sampling & lead time\", \"ru\": \"\u041e\u0431\u0440\u0430\u0437\u0446\u044b \u0438 \u0441\u0440\u043e\u043a\u0438\" },\n      \"text\": { \"zh\": \"\u5e38\u89c4\u89c4\u683c\u73b0\u8d27\u5373\u53d1\uff1b\u5b9a\u5236\u5305\u88c5\u786e\u8ba4\u8bbe\u8ba1\u7a3f\u540e\u6392\u4ea7\uff0c\u5468\u671f\u4e0b\u5355\u524d\u660e\u786e\u544a\u77e5\u3002\", \"en\": \"Standard specs ship from stock; custom packaging scheduled after artwork approval.\", \"ru\": \"\u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442 \u0441\u043e \u0441\u043a\u043b\u0430\u0434\u0430; \u043a\u0430\u0441\u0442\u043e\u043c \u043f\u043e\u0441\u043b\u0435 \u0443\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u044f \u043c\u0430\u043a\u0435\u0442\u0430.\" } },\n    { \"title\": { \"zh\": \"\u652f\u4ed8\u65b9\u5f0f\", \"en\": \"Payment\", \"ru\": \"\u041e\u043f\u043b\u0430\u0442\u0430\" },\n      \"text\": { \"zh\": \"\u5bf9\u516c\u8f6c\u8d26\u3001\u4fe1\u7528\u8bc1\u3002\u65b0\u5ba2\u6237\u9996\u5355\u6b3e\u5230\u53d1\u8d27\uff0c\u957f\u671f\u5ba2\u6237\u53ef\u534f\u5546\u8d26\u671f\u3002\", \"en\": \"Bank transfer and L/C. First order prepaid; terms negotiable for long-term partners.\", \"ru\": \"\u041f\u0435\u0440\u0435\u0432\u043e\u0434 \u0438 \u0430\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0438\u0432. \u041f\u0435\u0440\u0432\u044b\u0439 \u0437\u0430\u043a\u0430\u0437 \u2014 \u043f\u0440\u0435\u0434\u043e\u043f\u043b\u0430\u0442\u0430.\" } },\n    { \"title\": { \"zh\": \"\u5305\u88c5\u4e0e\u8d34\u724c\", \"en\": \"Packaging & private label\", \"ru\": \"\u0423\u043f\u0430\u043a\u043e\u0432\u043a\u0430 \u0438 \u0421\u0422\u041c\" },\n      \"text\": { \"zh\": \"\u652f\u6301 LOGO \u52a0\u5370\u3001\u5305\u88c5\u8bbe\u8ba1\u4e0e\u8d34\u724c\u4ee3\u5de5\u3002\u4f7f\u7528\u5ba2\u6237\u5546\u6807\u9700\u63d0\u4f9b\u8bc1\u660e\u6587\u4ef6\u3002\", \"en\": \"Logo printing, packaging design, contract manufacturing. Own trademark requires proof.\", \"ru\": \"\u041d\u0430\u043d\u0435\u0441\u0435\u043d\u0438\u0435 \u043b\u043e\u0433\u043e\u0442\u0438\u043f\u0430, \u0440\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u0443\u043f\u0430\u043a\u043e\u0432\u043a\u0438, \u0421\u0422\u041c.\" } },\n    { \"title\": { \"zh\": \"\u51fa\u53e3\u4e0e\u5355\u8bc1\", \"en\": \"Export & documents\", \"ru\": \"\u0 8\u3002\u8336\u53f6\u7531\u4fee\u6c34\u672c\u5730\u6301\u8bc1\u751f\u4ea7\u4f01\u4e1a\u4f9b\u8d27\uff0c\u6211\u4eec\u8d1f\u8d23\u9009\u54c1\u3001\u9a8c\u8d27\u3001\u96c6\u8d27\u4e0e\u51fa\u53e3\u4ea4\u4ed8\u3002\", \"en\": \"We are a supply-chain service provider licensed for import and export of goods and technology, and for import-export agency. Tea is supplied by licensed local manufacturers in Xiushui; we handle sourcing, inspection, consolidation and export delivery.\", \"ru\": \"\u041c\u044b \u2014 \u043f\u043e\u0441\u0442\u0430\u0432\u0449\u0438\u043a \u0443\u0441\u043b\u0443\u0433 \u0432 \u0441\u0444\u0435\u0440\u0435 \u0446\u0435\u043f\u0435\u0439 \u043f\u043e\u0441\u0442\u0430\u0432\u043e\u043a \u0441 \u043b\u0438\u0446\u0435\u043d\u0437\u0438\u044f\u043c\u0438 \u043d\u0430 \u0438\u043c\u043f\u043e\u0440\u0442/\u044d\u043a\u0441\u043f\u043e\u0440\u0442 \u0438 \u0430\u0433\u0435\u043d\u0442\u0441\u043a\u0443\u044e \u0412\u042d\u0414. \u0427\u0430\u0439 \u043f\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u044e\u0442 \u043b\u0438\u0446\u0435\u043d\u0437\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u043c\u0435\u0441\u0442\u043d\u044b\u0435 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u0438 \u0421\u044e\u0448\u0443\u0439; \u043c\u044b \u043e\u0442\u0432\u0435\u0447\u0430\u0435\u043c \u0437\u0430 \u043f\u043e\u0434\u0431\u043e\u0440, \u0438\u043d\u0441\u043f\u0435\u043a\u0446\u0438\u044e, \u043a\u043e\u043d\u0441\u043e\u043b\u0438\u0434\u0430\u0446\u0438\u044e \u0438 \u044d\u043a\u0441\u043f\u043e\u0440\u0442.\" } },\n    { \"q\": { \"zh\": \"\u8336\u53f6\u80fd\u5426\u505a\u888b\u6ce1\u8336\u3001\u679c\u8336\u3001\u82b1\u8349\u8336\uff1f\", \"en\": \"Can you supply tea bags, fruit and herbal teas?\", \"ru\": \"\u041f\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442\u0435 \u043b\u0438 \u043f\u0430\u043a\u0435\u0442\u0438\u043a\u0438, \u0444\u0440\u0443\u043a\u0442\u043e\u0432\u044b\u0435 \u0438 \u0442\u0440\u0430\u0432\u044 in window)) return;\n    var io = new IntersectionObserver(function (es) {\n      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n    }, { threshold: 0.08 });\n    $$('section').forEach(function (s) { s.classList.add('reveal'); io.observe(s); });\n  }\n\n  function initWechat() {\n    var el = $('#wxCopy');\n    if (!el) return;\n    el.onclick = function () {\n      var txt = el.textContent.trim();\n      var done = function () {\n        var old = el.textContent;\n        el.textContent = I18N[cur].msg.copied;\n        el.classList.add('copied');\n        setTimeout(function () { el.textContent = old; el.classList.remove('copied'); }, 1500);\n      };\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(txt).then(done, fb);\n      } else { fb(); }\n      function fb() {\n        var ta = document.createElement('textarea');\n        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';\n        document.body.appendChild(ta); ta.select();\n        try { document.execCommand('copy'); done(); } catch (e) {}\n        document.body.removeChild(ta);\n      }\n    };\n  }\n\n  /* ============================================================\n     \u8868\u5355 \u2192 Cloudflare Worker \u2192 Telegram + \u90ae\u4ef6\n     ============================================================ */\n  var ENDPOINT = 'https://gonghehou-form.tunnir243.workers.dev';\n\n  function initForm() {\n    var form = $('#contactForm'), msgEl = $('#formmsg');\n    if (!form) return;\n    form.addEventListener('submit', function (e) {\n      e.preventDefault();\n      var M = I18N[cur].msg;\n      var name = (form.name.value || '').trim();\n      var contact = (form.contact.value || '').trim();\n      if (!name || !contact) {\n        msgEl.className = 'formmsg bad'; msgEl.textContent = M.errFill; return;\n      }\n      var payload = {\n        name: name, contact: contact,\n        company: (form.company.value || '').trim(),\n        country: (form.country.value || '').trim(),\n        qty: form.qty.value, type: form.type.value,\n        msg: (form.msg.value || '').trim(),\n        lang: cur\n      };\n      msgEl.className = 'formmsg'; msgEl.textContent = M.send;\n      if (!ENDPOINT) {\n        setTimeout(function () { msgEl.className = 'formmsg ok'; msgEl.textContent = M.ok; form.reset(); }, 600);\n        return;\n      }\n      fetch(ENDPOINT, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(payload)\n      }).then(function (r) { return r.json(); })\n        .then(function (j) {\n          if (j && j.ok) { msgEl.className = 'formmsg ok'; msgEl.textContent = M.ok; form.reset(); }\n          else { msgEl.className = 'formmsg bad'; msgEl.textContent = M.errNetwork; }\n        })\n        .catch(function () { msgEl.className = 'formmsg bad'; msgEl.textContent = M.errNetwork; });\n    });\n  }\n\n  /* ============================================================\n     \u542f\u52a8\n     ============================================================ */\n  function loadJSON(url) {\n    /* \u5355\u6587\u4ef6\u7248\uff1a\u6570\u636e\u5df2\u5185\u8054\uff0c\u76f4\u63a5\u7528\uff0c\u907f\u514d file:// \u4e0b fetch \u88ab\u6d4f\u89c8\u5668\u62e6\u622a */\n    if (url.indexOf('site.json') > -1 && window.__ZSY_SITE__) return Promise.resolve(window.__ZSY_SITE__);\n    if (url.indexOf('products.json') > -1 && window.__ZSY_PROD__) return Promise.resolve(window.__ZSY_PROD__);\n    return fetch(url, { cache: 'no-store' }).then(function (r) {\n      if (!r.ok) throw new Error(url + ' ' + r.status);\n      return r.json();\n    });\n  }\n\n  /* ============================================================\n     \u5bf9\u5916\u94a9\u5b50\uff1a\u4f9b\u7ba1\u7406\u540e\u53f0\u5728 iframe \u91cc\u5b9e\u65f6\u5237\u65b0\u9884\u89c8\n     \u7528\u6cd5\uff1aiframe.contentWindow.ZSY.setData(siteObj, prodObj, 'zh')\n     ============================================================ */\n  window.ZSY = {\n    setData: function (site, prod, lang) {\n      if (site) SITE = site;\n      if (prod) PROD = prod;\n      if (lang && LANGS.indexOf(lang) > -1) cur = lang;\n      setLang(cur, true);\n    },\n    getLang: function () { return cur; }\n  };\n\n  function boot() {\n    setLang(detect(), true);\n    initNav(); initWechat(); initForm();\n\n    Promise.all([\n      loadJSON('data/site.json').catch(function (e) { console.warn(e); return null; }),\n      loadJSON('data/products.json').catch(function (e) { console.warn(e); return null; })\n    ]).then(function (res) {\n      SITE = res[0] || {};\n      PROD = res[1] || { categories: [], products: [] };\n      setLang(cur, true);\n      initReveal();\n    });\n\n    $$('#langswitch button').forEach(function (b) {\n      b.onclick = function () { setLang(b.getAttribute('data-lang')); };\n    });\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);\n  else boot();\n})();\n\n<\/script>\n</body>\n</html>\n";

/* ============================================================
   工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200); }
function trioVal(v,l){ if(v==null) return ''; if(typeof v==='string') return v; return v[l]||v.zh||''; }
function setTrio(obj,l,val){ if(typeof obj!=='object'||obj==null) return; obj[l]=val; }
function ensureTrio(o,k){ if(!o[k]||typeof o[k]!=='object') o[k]={zh:'',en:'',ru:''}; return o[k]; }

/* ============================================================
   渲染侧栏
   ============================================================ */
function renderSide(){
  var h = '<div class="t">站点内容</div>';
  SCHEMA.forEach(function(g){ h += '<a href="javascript:go(\''+g.id+'\')" data-g="'+g.id+'">'+esc(g.name)+'</a>'; });
  h += '<div class="t">产品</div>';
  h += '<a href="javascript:go(\'cats\')" data-g="cats">品类分组</a>';
  h += '<a href="javascript:go(\'prods\')" data-g="prods">商品列表<span class="n">'+(PROD&&PROD.products?PROD.products.length:0)+'</span></a>';
  $('side').innerHTML = h;
  markSide();
}
function markSide(){
  document.querySelectorAll('#side a').forEach(function(a){
    a.classList.toggle('on', a.getAttribute('data-g')===CUR);
  });
}
function go(id){ CUR=id; markSide(); renderEdit(); }

/* ============================================================
   渲染编辑区
   ============================================================ */
function renderEdit(){
  var e = $('edit');
  if(CUR==='cats'){ e.innerHTML = renderCats(); bindCats(); }
  else if(CUR==='prods'){ e.innerHTML = renderProds(); bindProds(); }
  else {
    var g = SCHEMA.filter(function(x){return x.id===CUR;})[0];
    if(!g){ e.innerHTML=''; return; }
    var h = '<div class="grp"><h3>'+esc(g.name)+'</h3>';
    g.fields.forEach(function(f){ h += fieldHTML(f); });
    h += '</div>';
    e.innerHTML = h;
  }
  pvUpdate();
}

function trioHTML(label, val, path, area){
  var v = val||{};
  var inp = area
    ? '<textarea data-p="'+path+'" data-l="zh">'+esc(v.zh||'')+'</textarea>'
      + '<textarea data-p="'+path+'" data-l="en">'+esc(v.en||'')+'</textarea>'
      + '<textarea data-p="'+path+'" data-l="ru">'+esc(v.ru||'')+'</textarea>'
    : '<input data-p="'+path+'" data-l="zh" value="'+esc(v.zh||'')+'">'
      + '<input data-p="'+path+'" data-l="en" value="'+esc(v.en||'')+'">'
      + '<input data-p="'+path+'" data-l="ru" value="'+esc(v.ru||'')+'">';
  return '<div class="fld"><label>'+esc(label)+'</label>'
    + '<div class="trio">'
    +   '<div class="cell"><span>中文</span>'+ (area? '<textarea data-p="'+path+'" data-l="zh">'+esc(v.zh||'')+'</textarea>':'<input data-p="'+path+'" data-l="zh" value="'+esc(v.zh||'')+'">') +'</div>'
    +   '<div class="cell"><span>English</span>'+ (area? '<textarea data-p="'+path+'" data-l="en">'+esc(v.en||'')+'</textarea>':'<input data-p="'+path+'" data-l="en" value="'+esc(v.en||'')+'">') +'</div>'
    +   '<div class="cell"><span>Русский</span>'+ (area? '<textarea data-p="'+path+'" data-l="ru">'+esc(v.ru||'')+'</textarea>':'<input data-p="'+path+'" data-l="ru" value="'+esc(v.ru||'')+'">') +'</div>'
    + '</div></div>';
}
function strHTML(label, val, path){
  return '<div class="fld"><label>'+esc(label)+'</label>'
    + '<input class="plain" data-p="'+path+'" value="'+esc(val||'')+'"></div>';
}
function imgHTML(label, val, path){
  return '<div class="fld"><label>'+esc(label)+'</label><div class="imgrow">'
    + '<div class="thumb" id="th_'+path.replace(/[.\[\]]/g,'_')+'" style="'+(val?'background-image:url('+esc(val)+')':'')+'"></div>'
    + '<div class="r"><input class="plain" data-p="'+path+'" value="'+esc(val||'')+'" placeholder="assets/img/xxx.jpg">'
    + '<div class="btns"><button onclick="pickImg(\''+path+'\')">上传图片</button>'
    + '<button onclick="clearImg(\''+path+'\')">清除</button></div>'
    + '<div class="hint">上传后自动转成内置图片，导出的单文件网页一定能显示。建议单张不超过 500KB。</div>'
    + '</div></div></div>';
}

function fieldHTML(f){
  var v = SITE ? SITE[f.k] : null;
  if(f.t==='trio')    return trioHTML(f.label, v, f.k, false);
  if(f.t==='trio-a')  return trioHTML(f.label, v, f.k, true);
  if(f.t==='str')     return strHTML(f.label, v, f.k);
  if(f.t==='img')     return imgHTML(f.label, v, f.k);
  if(f.t==='list-trio')   return listTrioHTML(f.label, f.k);
  if(f.t==='list-titled') return listTitledHTML(f.label, f.k);
  if(f.t==='list-qa')     return listQAHTML(f.label, f.k);
  return '';
}

    h += '<div class="item"><div class="bar"><span class="idx">'+(i+1)+'</span><span class="sp"></span>'
      + '<button onclick="mv(\''+key+'\','+i+',-1)">↑</button>'

    + arr.map(function(c){return '<b>'+esc(c.key)+'</b>';}).join('、') + '</div>';
  arr.forEach(function(c,i){
    h += '<div class="item"><div class="bar"><span class="idx">'+(i+1)+'</span><span class="sp"></span>'
      + '<button onclick="mvCat('+i+',-1)">↑</button><button onclick="mvCat('+i+',1)">↓</button>'
      + '<button class="del" onclick="delCat('+i+')">✕</button></div>'
      + '<div class="fld" style="margin-bottom:8px"><label style="font-size:.8rem">英文标识</label>'
      + '<input class="plain" data-cat="'+i+'.key" value="'+esc(c.key||'')+'"></div>'
      + '<div class="fld" style="margin-bottom:0"><label style="font-size:.8rem">显示名称</label><div class="trio">'
      + '<div class="cell"><span>中文</span><input data-cat="'+i+'.zh" value="'+esc(c.zh||'')+'"></div>'
      + '<div class="cell"><span>English</span><input data-cat="'+i+'.en" value="'+esc(c.en||'')+'"></div>'
      + '<div class="cell"><span>Русский</span><input data-cat="'+i+'.ru" value="'+esc(c.ru||'')+'"></div>'
      + '</div></div></div>';
  });
  h += '<button class="addbtn" onclick="addCat()">＋ 新增品类</button></div>';
  return h;
}
function bindCats(){
  document.querySelectorAll('#edit [data-cat]').forEach(function(el){
    el.addEventListener('input', function(){
      var p = el.getAttribute('data-cat').split('.');
      PROD.categories[+p[0]][p[1]] = el.value;
      pvUpdate();
    });
  });
}

/* ============================================================
   商品列表
   ============================================================ */
function renderProds(){
  var arr = (PROD&&PROD.products)||[];
  var catOpt = ((PROD&&PROD.categories)||[]).map(function(c){
    return '<option value="'+esc(c.key)+'">'+esc(c.key+' · '+(c.zh||''))+'</option>'; }).join('');
  var h = '<div class="grp"><h3>商品列表（'+arr.length+'）</h3>';
  arr.forEach(function(p,i){
    var specs = p.specs||[];
    h += '<div class="item" style="padding:14px"><div class="bar"><span class="idx">'+(i+1)+'</span>'
      + '<b style="font-size:.9rem;color:#1a3a5c">'+esc(trioVal(p.name,'zh')||'(未命名)')+'</b>'
      + '<span class="sp"></span>'
      + '<button onclick="mvProd('+i+',-1)">↑</button><button onclick="mvProd('+i+',1)">↓</button>'
      + '<button class="del" onclick="delProd('+i+')">✕</button></div>'
      + '<div class="fld"><label style="font-size:.8rem">名称</label><div class="trio">'
      + '<div class="cell"><span>中文</span><input data-pr="'+i+'.name.zh" value="'+esc(trioVal(p.name,'zh'))+'"></div>'
      + '<div class="cell"><span>English</span><input data-pr="'+i+'.name.en" value="'+esc(trioVal(p.name,'en'))+'"></div>'
      + '<div class="cell"><span>Русский</span><input data-pr="'+i+'.name.ru" value="'+esc(trioVal(p.name,'ru'))+'"></div>'
      + '</div></div>'
      + '<div class="fld"><label style="font-size:.8rem">副标题 / 卖点</label><div class="trio">'
      + '<div class="cell"><span>中文</span><input data-pr="'+i+'.subtitle.zh" value="'+esc(trioVal(p.subtitle,'zh'))+'"></div>'
      + '<div class="cell"><span>English</span><input data-pr="'+i+'.subtitle.en" value="'+esc(trioVal(p.subtitle,'en'))+'"></div>'
      + '<div class="cell"><span>Русский</span><input data-pr="'+i+'.subtitle.ru" value="'+esc(trioVal(p.subtitle,'ru'))+'"></div>'
      + '</div></div>'
      + '<div class="fld"><label style="font-size:.8rem">描述</label><div class="trio">'
      + '<div class="cell"><span>中文</span><textarea data-pr="'+i+'.desc.zh">'+esc(trioVal(p.desc,'zh'))+'</textarea></div>'
      + '<div class="cell"><span>English</span><textarea data-pr="'+i+'.desc.en">'+esc(trioVal(p.desc,'en'))+'</textarea></div>'
      + '<div class="cell"><span>Русский</span><textarea data-pr="'+i+'.desc.ru">'+esc(trioVal(p.desc,'ru'))+'</textarea></div>'
      + '</div></div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
      +   '<div style="flex:1;min-width:120px"><label style="font-size:.78rem;color:#1a3a5c;font-weight:700">内部标识</label>'
      +   '<input class="plain" data-pr="'+i+'.id" value="'+esc(p.id||'')+'"></div>'
      +   '<div style="flex:1;min-width:130px"><label style="font-size:.78rem;color:#1a3a5c;font-weight:700">所属品类</label>'
      +   '<select class="plain" data-pr="'+i+'.category">'+catOpt.replace('value="'+esc(p.category||'')+'"','value="'+esc(p.category||'')+'" selected')+'</select></div>'
      +   '<div style="width:92px"><label style="font-size:.78rem;color:#1a3a5c;font-weight:700">排序</label>'
      +   '<input class="plain" type="number" data-pr="'+i+'.order" value="'+esc(p.order==null?99:p.order)+'"></div>'
      +   '<div style="display:flex;align-items:flex-end"><label class="sw"><input type="checkbox" data-prpub="'+i+'"'+(p.published===false?'':' checked')+'>上架</label></div>'
      + '</div>'
      + '<div class="imgrow"><div class="thumb" id="pth_'+i+'" style="'+(p.image?'background-image:url('+esc(p.image)+')':'')+'"></div>'
      + '<div class="r"><label style="font-size:.78rem;color:#1a3a5c;font-weight:700">商品主图</label>'
      + '<input class="plain" data-pr="'+i+'.image" value="'+esc(p.image||'')+'" placeholder="assets/img/xxx.jpg">'
      + '<div class="btns"><button onclick="pickImgProd('+i+')">上传图片</button>'
      + '<button onclick="clearImgProd('+i+')">清除</button></div></div></div>'
      + '<div style="margin-top:12px"><label style="font-size:.8rem;color:#1a3a5c;font-weight:700">参数表（可增删行）</label>';
    specs.forEach(function(s,j){
      h += '<div class="item" style="background:#fff;margin-top:7px"><div class="bar"><span class="idx">参数 '+(j+1)+'</span><span class="sp"></span>'
        + '<button class="del" onclick="delSpec('+i+','+j+')">✕</button></div><div class="trio">'
        + '<div class="cell"><span>中文</span><input data-sp="'+i+'.'+j+'.k.zh" value="'+esc(trioVal(s.k,'zh'))+'"></div>'
        + '<div class="cell"><span>English</span><input data-sp="'+i+'.'+j+'.k.en" value="'+esc(trioVal(s.k,'en'))+'"></div>'
        + '<div class="cell"><span>Русский</span><input data-sp="'+i+'.'+j+'.k.ru" value="'+esc(trioVal(s.k,'ru'))+'"></div>'
        + '</div><div class="trio" style="margin-top:7px">'
        + '<div class="cell"><span>中文</span><input data-sp="'+i+'.'+j+'.v.zh" value="'+esc(trioVal(s.v,'zh'))+'"></div>'
        + '<div class="cell"><span>English</span><input data-sp="'+i+'.'+j+'.v.en" value="'+esc(trioVal(s.v,'en'))+'"></div>'
        + '<div class="cell"><span>Русский</span><input data-sp="'+i+'.'+j+'.v.ru" value="'+esc(trioVal(s.v,'ru'))+'"></div>'
        + '</div></div>';
    });
    h += '<button class="addbtn" style="margin-top:7px" onclick="addSpec('+i+')">＋ 新增参数行</button></div>';
    h += '</div>';
  });
  h += '<button class="addbtn" onclick="addProd()">＋ 新增商品</button></div>';
  return h;
}
function bindProds(){
  document.querySelectorAll('#edit [data-pr]').forEach(function(el){
    el.addEventListener('input', function(){
      setPath(PROD.products, el.getAttribute('data-pr'), el.value);
      pvUpdate();
    });
    el.addEventListener('change', function(){
      setPath(PROD.products, el.getAttribute('data-pr'), el.value);
      pvUpdate();
    });
  });
  document.querySelectorAll('#edit [data-prpub]').forEach(function(el){
    el.addEventListener('change', function(){
      PROD.products[+el.getAttribute('data-prpub')].published = el.checked;
      pvUpdate();
    });
  });
  document.querySelectorAll('#edit [data-sp]').forEach(function(el){
    el.addEventListener('input', function(){
      setPath(PROD.products, 'specs.'+el.getAttribute('data-sp'), el.value);
      pvUpdate();
    });
  });
}
function setPath(root, path, val){
  var parts = path.split('.');
  var o = root;
  for(var i=0;i<parts.length-1;i++){
    var k = parts[i];
    if(/^\d+$/.test(k)) k = +k;
    if(o[k]==null) o[k] = (/^\d+$/.test(parts[i+1]) ? [] : {});
    o = o[k];
  }
  o[parts[parts.length-1]] = val;
}

/* ============================================================
   增删改
   ============================================================ */
function mv(key,i,d){
  var a=SITE[key]; var j=i+d; if(j<0||j>=a.length) return;
  var t=a[i]; a[i]=a[j]; a[j]=t; renderEdit();
}
function del(key,i){ SITE[key].splice(i,1); renderEdit(); }
function addTrio(key){ SITE[key]=SITE[key]||[]; SITE[key].push({zh:'',en:'',ru:''}); renderEdit(); }
function addTitled(key){ SITE[key]=SITE[key]||[]; SITE[key].push({title:{zh:'',en:'',ru:''},text:{zh:'',en:'',ru:''}}); renderEdit(); }
function addQA(key){ SITE[key]=SITE[key]||[]; SITE[key].push({q:{zh:'',en:'',ru:''},a:{zh:'',en:'',ru:''}}); renderEdit(); }

function mvCat(i,d){ var a=PROD.categories,j=i+d; if(j<0||j>=a.length)return; var t=a[i];a[i]=a[j];a[j]=t; renderEdit(); }
function delCat(i){ PROD.categories.splice(i,1); renderEdit(); }
function addCat(){ PROD.categories=PROD.categories||[]; PROD.categories.push({key:'new-cat',zh:'新品类',en:'New',ru:'Новое'}); renderEdit(); }

function mvProd(i,d){ var a=PROD.products,j=i+d; if(j<0||j>=a.length)return; var t=a[i];a[i]=a[j];a[j]=t; renderEdit(); }
function delProd(i){ if(!confirm('确定删除这个商品？')) return; PROD.products.splice(i,1); renderEdit(); }
function addProd(){
  PROD.products=PROD.products||[];
  var cats=(PROD.categories||[]); 
  PROD.products.push({ id:'item-'+(Date.now()+'').slice(-6), category:(cats[0]&&cats[0].key)||'tea',
    order:PROD.products.length+1, published:true, image:'',
    name:{zh:'新商品',en:'New item',ru:'Новый товар'},
    subtitle:{zh:'',en:'',ru:''}, desc:{zh:'',en:'',ru:''}, specs:[] });
  renderEdit();
}
function addSpec(i){ PROD.products[i].specs=PROD.products[i].specs||[];
  PROD.products[i].specs.push({k:{zh:'',en:'',ru:''},v:{zh:'',en:'',ru:''}}); renderEdit(); }
function delSpec(i,j){ PROD.products[i].specs.splice(j,1); renderEdit(); }

/* ============================================================
   图片
   ============================================================ */
function pickImg(path){ imgTarget={t:'site',p:path}; $('fileImg').click(); }
function pickImgProd(i){ imgTarget={t:'prod',i:i}; $('fileImg').click(); }
function clearImg(path){ setPath(SITE,path,''); renderEdit(); }
function clearImgProd(i){ PROD.products[i].image=''; renderEdit(); }
$('fileImg').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  if(f.size>2*1024*1024){ toast('图片超过 2MB，请先压缩'); return; }
  var r=new FileReader();
  r.onload=function(){
    var d=r.result;
    if(imgTarget.t==='site'){ setPath(SITE,imgTarget.p,d); }
    else { PROD.products[imgTarget.i].image=d; }
    renderEdit(); toast('图片已嵌入');
  };
  r.readAsDataURL(f);
  e.target.value='';
});

/* ============================================================
   编辑区事件（顶层字段）
   ============================================================ */
document.addEventListener('input', function(e){
  var el=e.target;
  if(el.hasAttribute && el.hasAttribute('data-p')){
    var p=el.getAttribute('data-p'), l=el.getAttribute('data-l');
    if(l){ var o=ensureTrio(SITE,p); o[l]=el.value; }
    else setPath(SITE,p,el.value);
    pvUpdate();
  } else if(el.hasAttribute && el.hasAttribute('data-lp')){
    var pp=el.getAttribute('data-lp').split('.'), ll=el.getAttribute('data-l');
    var key=pp[0], idx=+pp[1];
    var it=SITE[key][idx];
    if(pp.length===3){ it[ll]=el.value; }
    else { var sub=pp[2]; if(!it[sub]||typeof it[sub]!=='object') it[sub]={zh:'',en:'',ru:''}; it[sub][ll]=el.value; }
    pvUpdate();
  }
});

/* ============================================================
   预览（iframe srcdoc + ZSY.setData 实时刷新）
   ============================================================ */
var pvReady=false;
function pvInit(){
  if(!PREVIEW_HTML){ $('pvFrame').srcdoc='<p style="padding:20px;font-family:sans-serif">预览源未注入</p>'; return; }
  $('pvFrame').srcdoc = PREVIEW_HTML;
  $('pvFrame').onload = function(){
    pvReady=true;
    try{ $('pvFrame').contentWindow.ZSY.setData(SITE,PROD,PV_LANG); }catch(e){}
  };
}
function pvUpdate(){
  if(!pvReady) return;
  try{ $('pvFrame').contentWindow.ZSY.setData(SITE,PROD,PV_LANG); }catch(e){}
}
function pvReload(){ pvReady=false; pvInit(); }
function pvLang(l,btn){
  PV_LANG=l;
  document.querySelectorAll('.prevbar button').forEach(function(b){ b.classList.remove('on'); });
  if(btn) btn.classList.add('on');
  pvUpdate();
}

/* ============================================================
   载入 / 导出
   ============================================================ */
function loadFiles(){
  if(!confirm('先选择 site.json，再选择 products.json')) return;
  $('fileSite').click();
}
$('fileSite').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ SITE=JSON.parse(r.result); $('fileProd').click(); };
  r.readAsText(f); e.target.value='';
});
$('fileProd').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ PROD=JSON.parse(r.result); renderSide(); renderEdit(); toast('已载入'); };
  r.readAsText(f); e.target.value='';
});

function download(name, text, mime){
  var b=new Blob([text],{type:mime||'application/json;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function exportJSON(which){
  if(which==='site'){ if(!SITE){toast('还没有数据');return;} download('site.json', JSON.stringify(SITE,null,2)); }
  else { if(!PROD){toast('还没有数据');return;} download('products.json', JSON.stringify(PROD,null,2)); }
  toast('已导出 '+which+'.json —— 放进 data/ 目录覆盖即可');
}
function exportSingle(){
  if(!PREVIEW_HTML){ toast('预览源缺失，无法导出'); return; }
  var h = PREVIEW_HTML
    .replace('window.__ZSY_SITE__=null','window.__ZSY_SITE__='+JSON.stringify(SITE))
    .replace(/window\.__ZSY_SITE__=\{[\s\S]*?\};/, 'window.__ZSY_SITE__='+JSON.stringify(SITE)+';')
    .replace(/window\.__ZSY_PROD__=\{[\s\S]*?\};/, 'window.__ZSY_PROD__='+JSON.stringify(PROD)+';');
  download('昭盛元官网.html', h, 'text/html;charset=utf-8');
  toast('已导出单文件网页（图片已内嵌，可直接发给客户）');
}

/* ============================================================
   启动
   ============================================================ */
(function boot(){
  /* 优先尝试从同目录 fetch（用本地服务器打开时可用） */
  var p1 = fetch('data/site.json').then(function(r){return r.json();}).catch(function(){return null;});
  var p2 = fetch('data/products.json').then(function(r){return r.json();}).catch(function(){return null;});
  Promise.all([p1,p2]).then(function(r){
    var useIn = window.__ZSY_SITE__ && window.__ZSY_PROD__;
    SITE = r[0] || (useIn?window.__ZSY_SITE__:null);
    PROD = r[1] || (useIn?window.__ZSY_PROD__:null);
    if(SITE||PROD){
      SITE = SITE||{}; PROD = PROD||{categories:[],products:[]};
      renderSide(); renderEdit();
    } else {
      $('edit').innerHTML = '<div class="intro"><h2>先载入数据</h2>'
        + '<p>点右上角的「📂 载入 JSON」，依次选择 <b>data/site.json</b> 和 <b>data/products.json</b>。</p>'
        + '<ol><li>在这个文件夹里执行 <code>python -m http.server 8000</code> 再打开，可自动载入并显示图片</li>'
        + '<li>直接双击打开也能用，只是图片要手动上传</li></ol></div>';
    }
    pvInit();
  });
})();
</script>
