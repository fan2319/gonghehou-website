# ============================================================
#   Netlify 部署配置（昭盛元站）
# ============================================================
[build]
  command = ""
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

# data/*.json 不缓存 —— 后台改完立刻生效，不用等 CDN
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# 不要加 /*  -> /index.html 200 的 SPA 重写，纯静态站用不上，会把 /admin/ 吞掉
